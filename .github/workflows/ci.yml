name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-php:
    name: PHP Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint (style check)
        run: ./vendor/bin/pint --test

  phpstan:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  backend:
    name: Backend Tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate app key
        run: cp .env.example .env && php artisan key:generate

      - name: Cache config
        run: php artisan config:clear

      - name: Run tests (enforce ≥80% coverage)
        run: php artisan test --ci --coverage --min=80 --coverage-clover build/logs/clover.xml

      - name: Upload coverage
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/logs/clover.xml
        continue-on-error: true

  frontend:
    name: Frontend Tests (Vitest + ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

      - name: Build (production assets)
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Generate app key
        run: cp .env.example .env && php artisan key:generate

      - name: Build assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          CI: 'true'
          APP_URL: http://localhost:8000
        run: npx playwright test

  docker:
    name: Production Image (Dockerfile.prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -f Dockerfile.prod -t taskflow:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name taskflow -p 8080:80 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY=base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            -e APP_URL=http://localhost:8080 \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/database.sqlite \
            -e CACHE_STORE=file -e SESSION_DRIVER=file -e QUEUE_CONNECTION=sync \
            taskflow:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up >/dev/null; then break; fi
            sleep 2
          done
          # /up proves nginx -> php-fpm -> Laravel boots; / renders the Inertia
          # welcome page, which also proves the in-image Vite manifest is found.
          curl -fsS -o /dev/null -w 'GET /up -> %{http_code}\n' http://localhost:8080/up
          curl -fsS -o /dev/null -w 'GET /   -> %{http_code}\n' http://localhost:8080/
          docker exec taskflow php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);'
          docker rm -f taskflow

      - name: Image size
        run: |
          docker image inspect taskflow:ci --format 'virtual size: {{.Size}} bytes'
