[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queued work (notifications, digests) must be consumed for mail to reach
; Mailpit. Without this program, ShouldQueue notifications pile up in Redis
; forever and `make up` alone silently drops all mail (see issue #87).
; --max-time recycles the worker hourly to bound memory; supervisor restarts it.
[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --tries=3 --max-time=3600 --sleep=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0