; TaskFlow PHP configuration (production)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 22M
max_execution_time = 60
max_input_time = 60

; Realpath lookups are cached for the whole request cycle: the container image
; never changes underneath a running worker, so stat() calls are pure overhead.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; No filesystem polling in production: the image is rebuilt (and the container
; restarted) on every deploy, which is what invalidates the compiled cache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.enable_file_override = 0
opcache.save_comments = 1

error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

date.timezone = UTC

expose_php = Off
