; TaskFlow production pool — talks to nginx over a unix socket (no TCP port
; is exposed between the two processes). Replaces the image's default www.conf.
[www]

user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = nginx
listen.mode = 0660
listen.backlog = 511

; ondemand keeps idle workers out of the way, which matters for the
; scale-to-zero target in docs/ARCHITECTURE.md. Raise max_children when the
; container gets more vCPUs; keep max_children x memory_limit <= container RAM.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Worker output goes to the container log instead of disappearing in
; php-fpm.log, and the env injected at runtime stays visible to the app.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php

; nginx is the single access-log source: its lines carry the client address,
; the byte counts and the X-Forwarded-For chain. The base image's docker.conf
; would add a second, shorter line per request straight to stderr.
access.log = /dev/null

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
